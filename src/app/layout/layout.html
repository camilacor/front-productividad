<div class="shell">
  <header class="topbar">
    <span class="brand">Productividad</span>
    @if (usuario(); as u) {
      <span class="user">{{ u.nombre }} · {{ u.rol }}</span>
    }
    <button type="button" class="logout" (click)="logout()">Cerrar sesión</button>
  </header>

  <div class="body">
    <nav class="sidebar">
      @for (item of menuItems(); track item.path) {
        @if (item.children) {
          <span class="group-label">{{ item.label }}</span>
          @for (child of item.children; track child.path) {
            <a class="submenu-link" [routerLink]="child.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              {{ child.label }}
            </a>
          }
        } @else {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
