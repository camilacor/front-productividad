@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (enCurso(); as caso) {
  <section class="card">
    <h3>Caso en curso</h3>
    <p><strong>{{ caso.numeroFactura }}</strong> — {{ caso.procesoNombre }}</p>
    <p class="timer">{{ tiempoTranscurrido() }}</p>
    <button type="button" (click)="finalizar()" [disabled]="cargando()">Finalizar</button>
  </section>
} @else {
  <section class="card">
    <h3>Iniciar un caso</h3>
    <form [formGroup]="form" (ngSubmit)="iniciar()">
      <label>
        N° de factura
        <input type="text" formControlName="numeroFactura" />
        @if (form.controls.numeroFactura.invalid && form.controls.numeroFactura.touched) {
          <span class="campo-error">El número de factura es obligatorio.</span>
        }
      </label>

      <label>
        Proceso
        <select formControlName="procesoId">
          <option [ngValue]="null">Seleccione un proceso</option>
          @for (proceso of procesosActivos(); track proceso.id) {
            <option [ngValue]="proceso.id">{{ proceso.nombre }}</option>
          }
        </select>
        @if (form.controls.procesoId.invalid && form.controls.procesoId.touched) {
          <span class="campo-error">Debe seleccionar un proceso.</span>
        }
      </label>

      <label>
        Tipo de generación
        <select formControlName="tipoGeneracion">
          <option value="MANUAL">Manual</option>
          <option value="AUTOMATICA">Automática</option>
        </select>
      </label>

      <button type="submit" [disabled]="cargando()">Iniciar</button>
    </form>
  </section>
}
